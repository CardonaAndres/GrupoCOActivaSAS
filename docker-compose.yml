services:
  grupocoactiva_web:
    build:
      context: .
      dockerfile: Dockerfile
    image: grupocoactiva-web:latest
    container_name: grupocoactiva_web
    restart: always
    env_file:
      - .env.production
    environment:
      TZ: America/Bogota
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.grupocoactiva.rule=Host(`grupocoactivasas.com`)"
      - "traefik.http.routers.grupocoactiva.entrypoints=websecure"
      - "traefik.http.routers.grupocoactiva.tls=true"
      - "traefik.http.routers.grupocoactiva.tls.certresolver=letsencrypt"
      - "traefik.http.services.grupocoactiva.loadbalancer.server.port=3000"
    networks:
      - traefik-network
      - default 

networks:
  traefik-network:
    external: true
    name: traefik