services:
  grupocoactiva_web:
    build:
      context: .
      dockerfile: Dockerfile
    image: grupocoactiva-web:latest
    container_name: grupocoactiva_web
    restart: always
    env_file:
      - .env.production
    environment:
      TZ: America/Bogota
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"

      # ── www (sitio principal) ──────────────────────────────
      - "traefik.http.routers.grupocoactiva-www.rule=Host(`www.grupocoactivasas.com`)"
      - "traefik.http.routers.grupocoactiva-www.entrypoints=websecure"
      - "traefik.http.routers.grupocoactiva-www.tls=true"
      - "traefik.http.routers.grupocoactiva-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grupocoactiva-www.service=grupocoactiva-svc"

      # ── apex (sin www) → 301 a www ──────────────────────────
      - "traefik.http.routers.grupocoactiva-apex.rule=Host(`grupocoactivasas.com`)"
      - "traefik.http.routers.grupocoactiva-apex.entrypoints=websecure"
      - "traefik.http.routers.grupocoactiva-apex.tls=true"
      - "traefik.http.routers.grupocoactiva-apex.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grupocoactiva-apex.middlewares=grupocoactiva-www-redirect"
      - "traefik.http.routers.grupocoactiva-apex.service=grupocoactiva-svc"

      - "traefik.http.middlewares.grupocoactiva-www-redirect.redirectregex.regex=^https://grupocoactivasas\\.com/(.*)"
      - "traefik.http.middlewares.grupocoactiva-www-redirect.redirectregex.replacement=https://www.grupocoactivasas.com/$${1}"
      - "traefik.http.middlewares.grupocoactiva-www-redirect.redirectregex.permanent=true"

      - "traefik.http.services.grupocoactiva-svc.loadbalancer.server.port=3000"
    networks:
      - traefik-network
      - default

networks:
  traefik-network:
    external: true
    name: traefik